env: dev      # 当前使用环境，例如：dev则表示当前是在本地开发环境，若需要部署，已经放到服务器上，则修改为prod

dev:      # 本地开发环境
  app:      # FastAPI应用配置
    name: Student Information Management System     # 应用名称
    description: 学生信息管理系统，实现学生、管理员的登录、注册、信息管理等功能      # 应用描述
    api: /api/v2              # 应用接口，提供给接口测试工具或者是给前端开发的一个接口前缀
    host: 0.0.0.0             # 应用主机地址，设置服务器外部可访问
    port: 8000                # 应用端口
    uvicorn: app.main:app     # uvicorn应用入口，根据实际场景设置
    version: 2.0.0            # 应用版本，自行设置
    reload: true              # 是否自动重载应用

  db:                                   # 数据库配置
    host: localhost                     # 数据库主机地址，这里使用Docker，而Docker机器实际是在本地计算机上，因此可以使用localhost
    port: 5433                          # 数据库端口
    username: root                      # 数据库用户名
    password: password                  # 数据库密码
    database: student_info              # 数据库名称
    driver_name: postgresql+asyncpg     # 数据库连接驱动
    echo: true                          # 是否开启sqlalchemy日志
    max_overflow: 10                    # 允许溢出连接池大小的最大连接数
    pool_size: 50                       # 连接池大小，0表示连接数无限制
    pool_recycle: 3600                  # 连接回收时间（单位：秒）
    pool_timeout: 30                    # 连接池中没有线程可用时，最多等待的时间（单位：秒）

  redis:                # Redis配置
    host: localhost     # Redis主机地址
    port: 6378          # Redis端口
    username: ""        # Redis用户名，设置为空就行了
    password: ""        # Redis密码，设置为空即可
    db: 0               # Redis数据库索引，它是从0开始的

prod:     # 生产环境
  app:
    name: Student Information Management System(prod)
    description: 学生信息管理系统，实现学生、管理员的登录、注册、信息管理等功能
    api: /api/v2
    host: 0.0.0.0
    port: 9999
    uvicorn: app.main:app
    version: 2.0.0
    reload: false

  db:
    host: localhost
    port: 5432
    username: root
    password: password
    database: student_info
    driver_name: postgresql+asyncpg
    echo: true
    max_overflow: 10
    pool_size: 50
    pool_recycle: 3600
    pool_timeout: 30

  redis:
    host: localhost
    port: 6379
    username: ""
    password: ""
    db: 0