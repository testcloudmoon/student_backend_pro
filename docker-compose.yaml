services:
  postgresql_db:
    restart: unless-stopped
    image: postgres:17
    container_name: postgresql
    environment:
      POSTGRES_DB: student_info
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_db:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6378:6379"

volumes:
  postgres_db:
